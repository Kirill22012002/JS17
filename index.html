<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles/normalize.css" rel="stylesheet">
    <link href="styles/style.css" rel="stylesheet">
    <title>Document</title>
</head>

<body>
    <form>
        <p class="title">Registration</p>
        <label for="name" class="personal_data">Имя</label>
        <input class="personal_data-input" type="text" placeholder="Enter your name" id="name" />
        <label for="email" class="personal_data">Почта</label>
        <input class="personal_data-input" type="email" placeholder="Enter your email" id="email" />
        <label for="password" class="personal_data">Пароль</label>
        <input class="personal_data-input" type="password" placeholder="Create password" id="password" />
        <label for="password" class="personal_data">Пароль</label>
        <input class="personal_data-input" type="password" placeholder="Confirm password" id="password" />
        <label class="accept"><input type="checkbox">I accept all terms</label>
        <button class="button" type="submit">Register now</button>
        <p class="">Already have an account? <a class="link">Login now</a></p>
    </form>
    <form>
        <p class="title">Login</p>
        <label for="email" class="personal_data">Почта</label>
        <input class="personal_data-input" type="email" placeholder="Enter your email" id="email" />
        <label for="password" class="personal_data">Пароль</label>
        <input class="personal_data-input" type="password" placeholder="Password" id="password" />
        <label class="accept"><input type="checkbox">Remember account</label>
        <input class="button" type="button" value="Entry">
        <p class="">Don't have an account? <a class="link">Register now</a></p>
    </form>
    <script src="scripts/script.js"></script>
</body>

</html>
